---
- name: Configure Healthcare Database Server
  hosts: DB_Server
  become: true
  gather_facts: true

  vars:
    mysql_database: healthcare_db
    mysql_user: healthcare_user
    mysql_password: "Healthcare@123"
    app_server_ip: "10.0.1.150"

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install MySQL Server and Python MySQL library
      ansible.builtin.apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present

    - name: Enable and start MySQL
      ansible.builtin.systemd:
        name: mysql
        enabled: true
        state: started

    - name: Create Healthcare database
      community.mysql.mysql_db:
        name: "{{ mysql_database }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create Healthcare database user
      ansible.builtin.shell: |
        mysql --protocol=socket -uroot <<'SQL'
        DROP USER IF EXISTS '{{ mysql_user }}'@'{{ app_server_ip }}';
        CREATE USER '{{ mysql_user }}'@'{{ app_server_ip }}'
        IDENTIFIED WITH caching_sha2_password BY '{{ mysql_password }}';
        GRANT ALL PRIVILEGES ON {{ mysql_database }}.*
        TO '{{ mysql_user }}'@'{{ app_server_ip }}';
        FLUSH PRIVILEGES;
        SQL
      args:
        executable: /bin/bash
      changed_when: true

    - name: Configure MySQL to listen on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: true
      notify: Restart MySQL

    - name: Ensure MySQL is running
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true

    - name: Check MySQL status
      ansible.builtin.command:
        cmd: systemctl is-active mysql
      register: mysql_status
      changed_when: false

    - name: Display MySQL status
      ansible.builtin.debug:
        msg: "MySQL status: {{ mysql_status.stdout }}"

    - name: Verify Healthcare database
      ansible.builtin.shell: |
        mysql --protocol=socket -uroot \
        -e "SHOW DATABASES LIKE '{{ mysql_database }}';"
      register: database_check
      changed_when: false

    - name: Display database verification
      ansible.builtin.debug:
        msg: "{{ database_check.stdout }}"

    - name: Verify Healthcare database user
      ansible.builtin.shell: |
        mysql --protocol=socket -uroot \
        -e "SELECT user,host,plugin FROM mysql.user WHERE user='{{ mysql_user }}';"
      register: user_check
      changed_when: false

    - name: Display database user verification
      ansible.builtin.debug:
        msg: "{{ user_check.stdout }}"

  handlers:

    - name: Restart MySQL
      ansible.builtin.systemd:
        name: mysql
        state: restarted
